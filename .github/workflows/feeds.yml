name: discord-feeds

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      latest:
        description: 'Post the newest item of every feed once'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check feeds
        env:
          WEBHOOK_VIDEOS: ${{ secrets.WEBHOOK_VIDEOS }}
          WEBHOOK_RELEASES: ${{ secrets.WEBHOOK_RELEASES }}
          WEBHOOK_NEWS: ${{ secrets.WEBHOOK_NEWS }}
          PING_VIDEOS: ${{ vars.PING_VIDEOS }}
          PING_RELEASES: ${{ vars.PING_RELEASES }}
          PING_NEWS: ${{ vars.PING_NEWS }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 feeds.py ${{ inputs.latest && '--latest' || '' }}
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "genry-feeds"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "feeds: state"
            git push
          fi
